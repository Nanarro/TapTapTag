<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapTapTag · Identidad Profesional Inteligente</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1A4FFF;
    --blue-light: #4D7BFF;
    --blue-glow: rgba(26,79,255,0.35);
    --cyan: #00E5FF;
    --cyan-glow: rgba(0,229,255,0.25);
    --white: #F5F8FF;
    --dark: #060A14;
    --dark2: #0B1020;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--dark);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
  }

  /* TAP COMIC EFFECT */
  .tap-comic {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 28px;
    color: #fff;
    text-shadow:
      -2px -2px 0 #1A4FFF,
       2px -2px 0 #1A4FFF,
      -2px  2px 0 #1A4FFF,
       2px  2px 0 #1A4FFF,
      -3px  0   0 #00E5FF,
       3px  0   0 #00E5FF,
       0   -3px 0 #00E5FF,
       0    3px 0 #00E5FF;
    letter-spacing: -1px;
    transform: translate(-50%, -50%) rotate(var(--rot)) scale(0);
    animation: comicPop 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    white-space: nowrap;
    user-select: none;
  }
  @keyframes comicPop {
    0%   { transform: translate(-50%,-50%) rotate(var(--rot)) scale(0);   opacity: 1; }
    40%  { transform: translate(-50%,-50%) rotate(var(--rot)) scale(1.2); opacity: 1; }
    70%  { transform: translate(-50%,-50%) rotate(var(--rot)) scale(0.95); opacity: 1; }
    85%  { transform: translate(-50%,-50%) rotate(var(--rot)) scale(1);   opacity: 1; }
    100% { transform: translate(-50%,-70%) rotate(var(--rot)) scale(0.9); opacity: 0; }
  }

  /* CANVAS */
  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 48px;
    background: linear-gradient(to bottom, rgba(6,10,20,0.9), transparent);
    backdrop-filter: blur(2px);
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800; font-size: 22px;
    color: var(--white);
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--cyan); }
  .nav-tag {
    font-size: 11px; font-weight: 500;
    color: rgba(255,255,255,0.4);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* SECTIONS */
  section { position: relative; z-index: 1; }

  /* HERO */
  #hero {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 120px 24px 80px;
    overflow: hidden;
  }

  /* 3D CARD CANVAS */
  #card3d {
    width: 340px; height: 220px;
    margin: 0 auto 48px;
    display: block;
    filter: drop-shadow(0 20px 48px rgba(26,79,255,0.4));
    animation: fadeSlideUp 0.8s 0.05s ease both;
  }
  @media(max-width:480px){ #card3d{ width:280px; height:180px; } }

  /* FOUNDERS */
  .founders-section {
    padding: 80px 24px 0;
    max-width: 700px; margin: 0 auto;
  }
  .founders-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    margin-top: 32px;
  }
  @media(max-width:520px){ .founders-grid{grid-template-columns:1fr;} }
  .founder-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 22px;
    display: flex; align-items: center; gap: 16px;
    transition: border-color 0.3s, transform 0.3s;
  }
  .founder-card:hover { border-color: rgba(26,79,255,0.4); transform: translateY(-4px); }
  .founder-avatar {
    width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px;
    box-shadow: 0 0 20px var(--blue-glow);
  }
  .founder-avatar.gm { background: linear-gradient(135deg, #1A4FFF, #00E5FF); }
  .founder-avatar.sb { background: linear-gradient(135deg, #6B21A8, #4D7BFF); }
  .founder-info { min-width: 0; }
  .founder-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .founder-role { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 3px; }
  .founder-tag {
    display: inline-block; margin-top: 8px;
    font-size: 9px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    color: var(--cyan); background: rgba(0,229,255,0.08);
    border: 1px solid rgba(0,229,255,0.2); border-radius: 100px; padding: 2px 8px;
  }

  .tap-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(0,229,255,0.08);
    border: 1px solid rgba(0,229,255,0.25);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 11px; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 24px;
    animation: fadeSlideUp 0.8s ease both;
  }
  .tap-dot {
    width: 6px; height: 6px;
    background: var(--cyan);
    border-radius: 50%;
    animation: blink 1.2s ease infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(42px, 7vw, 88px);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -3px;
    margin-bottom: 24px;
    animation: fadeSlideUp 0.8s 0.15s ease both;
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(135deg, var(--blue-light), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero-sub {
    font-size: clamp(15px, 2vw, 19px);
    font-weight: 300;
    color: rgba(255,255,255,0.55);
    max-width: 520px;
    line-height: 1.6;
    margin: 0 auto 40px;
    animation: fadeSlideUp 0.8s 0.3s ease both;
  }
  .hero-cta {
    display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
    animation: fadeSlideUp 0.8s 0.45s ease both;
    margin-bottom: 80px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--blue), var(--blue-light));
    color: #fff;
    border: none;
    padding: 14px 32px;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500;
    cursor: pointer;
    box-shadow: 0 0 32px var(--blue-glow);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-primary:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 0 48px var(--blue-glow); }
  .btn-secondary {
    background: transparent;
    color: rgba(255,255,255,0.7);
    border: 1px solid var(--border);
    padding: 14px 32px;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 400;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-secondary:hover { border-color: rgba(0,229,255,0.4); color: var(--cyan); }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* SCROLL INDICATOR */
  .scroll-hint {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    opacity: 0.35; animation: fadeSlideUp 1s 1s ease both;
    padding-bottom: 40px;
  }
  .scroll-hint span { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
  .scroll-line { width: 1px; height: 40px; background: linear-gradient(to bottom, rgba(255,255,255,0.5), transparent); animation: scrollAnim 2s ease infinite; }
  @keyframes scrollAnim { 0%{transform:scaleY(0);transform-origin:top} 50%{transform:scaleY(1);transform-origin:top} 51%{transform:scaleY(1);transform-origin:bottom} 100%{transform:scaleY(0);transform-origin:bottom} }

  /* DEMO SECTION */
  #demo {
    padding: 100px 24px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .section-label {
    text-align: center;
    font-size: 11px; font-weight: 500;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 16px;
  }
  .section-title {
    text-align: center;
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 700;
    letter-spacing: -1.5px;
    margin-bottom: 64px;
  }

  /* DEMO PHONE */
  .demo-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: center;
  }
  @media(max-width:700px){ .demo-grid{grid-template-columns:1fr;} }

  .phone-wrap {
    position: relative;
    display: flex; justify-content: center;
  }
  .phone-frame {
    width: 240px;
    background: #0d1320;
    border-radius: 36px;
    border: 2px solid rgba(255,255,255,0.1);
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
  }
  .phone-notch {
    height: 28px;
    background: #0d1320;
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .phone-notch-bar { width: 60px; height: 8px; background: #1a2030; border-radius: 10px; }
  .phone-screen {
    background: linear-gradient(160deg, #0f1525 0%, #060A14 100%);
    padding: 20px 16px 24px;
    min-height: 420px;
  }

  /* Tap animation overlay */
  .tap-overlay {
    position: absolute; inset: 0;
    background: rgba(0,229,255,0.07);
    display: flex; align-items: center; justify-content: center;
    border-radius: 34px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 10;
  }
  .tap-overlay.active { opacity: 1; }
  .tap-ripple {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 2px solid var(--cyan);
    animation: tapRipple 0.6s ease-out forwards;
  }
  @keyframes tapRipple {
    0%  { transform: scale(0.5); opacity: 1; }
    100%{ transform: scale(2.5); opacity: 0; }
  }

  .profile-header {
    display: flex; flex-direction: column; align-items: center;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    margin-bottom: 16px;
  }
  .profile-avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px;
    margin-bottom: 10px;
    box-shadow: 0 0 20px var(--blue-glow);
  }
  .profile-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; }
  .profile-role { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 3px; }
  .profile-badge {
    display: flex; align-items: center; gap: 5px;
    background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.25);
    border-radius: 100px; padding: 3px 10px;
    font-size: 9px; font-weight: 600; letter-spacing: 1px;
    color: var(--cyan); text-transform: uppercase;
    margin-top: 8px;
  }
  .phone-links { display: flex; flex-direction: column; gap: 8px; }
  .phone-link {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 12px; font-weight: 500;
    color: rgba(255,255,255,0.8);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    animation: linkAppear 0.4s ease both;
  }
  .phone-link:hover { background: rgba(26,79,255,0.12); border-color: rgba(26,79,255,0.35); transform: translateX(3px); }
  .phone-link:nth-child(1){ animation-delay: 0.1s }
  .phone-link:nth-child(2){ animation-delay: 0.2s }
  .phone-link:nth-child(3){ animation-delay: 0.3s }
  .phone-link:nth-child(4){ animation-delay: 0.4s }
  .phone-link:nth-child(5){ animation-delay: 0.5s }
  @keyframes linkAppear {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .link-icon {
    width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .link-arrow { margin-left: auto; opacity: 0.3; font-size: 12px; }

  .phone-footer {
    text-align: center; margin-top: 16px;
    font-size: 9px; color: rgba(255,255,255,0.2);
    letter-spacing: 1px; text-transform: uppercase;
  }
  .phone-footer span { color: var(--cyan); opacity: 0.6; }

  /* Card floating */
  .card-float {
    position: absolute;
    bottom: -20px; left: -40px;
    width: 170px;
    background: linear-gradient(135deg, #1530A0, #0B1A70);
    border-radius: 16px;
    border: 1px solid rgba(77,123,255,0.4);
    padding: 14px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 24px var(--blue-glow);
    animation: floatCard 4s ease-in-out infinite;
  }
  @keyframes floatCard {
    0%,100%{transform:translateY(0) rotate(-3deg)}
    50%{transform:translateY(-10px) rotate(-3deg)}
  }
  .card-nfc { font-size: 9px; color: rgba(255,255,255,0.4); letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }
  .card-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; line-height: 1.2; }
  .card-title { font-size: 9px; color: rgba(255,255,255,0.5); margin-top: 3px; }
  .card-chip {
    position: absolute; bottom: 12px; right: 12px;
    width: 22px; height: 16px;
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    border-radius: 3px;
    opacity: 0.8;
  }

  /* NFC DEMO ANIMATION */
  .nfc-scene {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  /* ---- PHONE ---- */
  .demo-phone {
    width: 180px;
    background: #0d1320;
    border-radius: 28px;
    border: 2px solid rgba(255,255,255,0.12);
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }
  .demo-phone-notch {
    height: 20px;
    background: #0d1320;
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .demo-phone-notch-bar { width: 44px; height: 6px; background: #1a2030; border-radius: 10px; }
  .demo-phone-screen {
    background: linear-gradient(160deg, #0f1525 0%, #060A14 100%);
    padding: 14px 12px 16px;
    min-height: 280px;
    display: flex; flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  /* idle state — NFC icon pulsing */
  .demo-nfc-idle {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    transition: opacity 0.5s;
  }
  .demo-nfc-idle.hidden { opacity: 0; pointer-events: none; }

  .idle-nfc-icon {
    position: relative;
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
  }
  .idle-nfc-ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid rgba(0,229,255,0.5);
    animation: idleRingPulse 2s ease-in-out infinite;
  }
  .idle-nfc-ring:nth-child(1) { width: 56px; height: 56px; animation-delay: 0s; }
  .idle-nfc-ring:nth-child(2) { width: 40px; height: 40px; animation-delay: 0.3s; }
  .idle-nfc-ring:nth-child(3) { width: 24px; height: 24px; animation-delay: 0.6s; }
  @keyframes idleRingPulse {
    0%,100% { opacity: 0.25; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.08); }
  }
  .idle-nfc-dot {
    width: 8px; height: 8px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--cyan);
    position: relative; z-index: 1;
  }
  .idle-label {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }

  /* activated state — profile appears */
  .demo-profile {
    width: 100%;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s, transform 0.5s;
    pointer-events: none;
  }
  .demo-profile.visible {
    opacity: 1; transform: translateY(0); pointer-events: auto;
  }
  .demo-profile-head {
    display: flex; flex-direction: column; align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    margin-bottom: 10px;
  }
  .demo-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 14px;
    margin-bottom: 7px;
    box-shadow: 0 0 16px var(--blue-glow);
  }
  .demo-pname { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 11px; }
  .demo-prole { font-size: 9px; color: rgba(255,255,255,0.4); margin-top: 2px; }
  .demo-pbadge {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.25);
    border-radius: 100px; padding: 2px 7px; margin-top: 5px;
    font-size: 7px; font-weight: 600; letter-spacing: 1px; color: var(--cyan); text-transform: uppercase;
  }
  .demo-links { display: flex; flex-direction: column; gap: 5px; }
  .demo-link {
    display: flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px; padding: 6px 8px;
    font-size: 9px; color: rgba(255,255,255,0.75);
    opacity: 0; transform: translateX(-6px);
    transition: opacity 0.3s, transform 0.3s;
  }
  .demo-link.appear { opacity: 1; transform: translateX(0); }
  .demo-link-icon { font-size: 10px; }
  .demo-link-arr { margin-left: auto; opacity: 0.3; font-size: 9px; }

  /* NFC flash on phone */
  .demo-nfc-flash {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 70%, rgba(0,229,255,0.25) 0%, transparent 70%);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
    border-radius: 26px;
  }
  .demo-nfc-flash.active { opacity: 1; }

  /* ---- NFC WAVES between phone & card ---- */
  .nfc-waves-wrap {
    position: relative;
    width: 100%;
    height: 64px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    z-index: 1;
  }
  .nfc-wave {
    position: absolute;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(to right, transparent, var(--cyan), transparent);
    opacity: 0;
    width: 60%;
    animation: waveTravel 1.8s ease-in-out infinite;
  }
  .nfc-wave:nth-child(1) { animation-delay: 0s; }
  .nfc-wave:nth-child(2) { animation-delay: 0.4s; }
  .nfc-wave:nth-child(3) { animation-delay: 0.8s; }
  .nfc-wave:nth-child(4) { animation-delay: 1.2s; }
  .nfc-wave.paused { animation-play-state: paused; opacity: 0; }
  @keyframes waveTravel {
    0%   { opacity: 0; transform: translateY(20px) scaleX(0.3); }
    20%  { opacity: 0.8; }
    60%  { opacity: 0.6; }
    100% { opacity: 0; transform: translateY(-20px) scaleX(0.3); }
  }
  .nfc-dot-center {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan);
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 2;
  }
  .nfc-dot-center.active { opacity: 1; }

  /* ---- NFC CARD ---- */
  .demo-card-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
    position: relative;
    z-index: 2;
  }
  .demo-card {
    width: 200px;
    background: linear-gradient(135deg, #1530A0, #0B1A70);
    border-radius: 14px;
    border: 1px solid rgba(77,123,255,0.5);
    padding: 16px;
